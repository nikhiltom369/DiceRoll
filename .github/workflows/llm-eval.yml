name: AI model test

on:
  push:
    paths:
      - "voice-reply/android/app/src/main/cpp/**"
      - ".github/workflows/llm-eval.yml"
  workflow_dispatch:

jobs:
  scout:
    name: List small GGUF chat models
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "author=ggml-org&search=gguf" "author=unsloth&search=it-GGUF" "author=Qwen&search=GGUF" "author=bartowski&search=gemma"; do
            echo "== $q"
            curl -s "https://huggingface.co/api/models?$q&sort=downloads&direction=-1&limit=40" \
              | jq -r '.[] | "\(.id)  gated=\(.gated // "?")  updated=\(.lastModified // .createdAt // "?")"' || true
          done

  talk:
    name: German chat test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen2.5-1.5b
            url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          - name: gemma3-1b-ggml-org
            url: https://huggingface.co/ggml-org/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf
          - name: gemma3-1b-bartowski
            url: https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF/resolve/main/google_gemma-3-1b-it-Q4_K_M.gguf
          - name: qwen2.5-3b
            url: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4

      - name: Build engine test
        run: |
          cmake -S voice-reply/android/app/src/main/cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llm_test -j4

      - name: Download model (no login)
        run: |
          curl -fL --retry 3 -o model.gguf "${{ matrix.url }}"
          ls -la model.gguf

      - name: German conversation
        run: |
          ./build/llm_test model.gguf \
            "Hallo! Wie geht es dir heute?" \
            "Ich heiße Max und ich lerne Deutsch. Kannst du mir einen Tipp geben?" \
            "Was kann man am Wochenende in Berlin machen?" \
            "Wie heiße ich?"
