name: AI model test

# Builds the app's chat engine (llama.cpp) on a PC, downloads the same model
# the app downloads, and checks it holds a German conversation.

on:
  push:
    paths:
      - "voice-reply/android/app/src/main/cpp/**"
      - "voice-reply/android/app/src/main/assets/**"
      - "voice-reply/android/app/src/main/java/com/voicereply/app/ModelStore.kt"
      - ".github/workflows/llm-eval.yml"
  workflow_dispatch:

jobs:
  talk:
    name: German chat test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build engine test
        run: |
          cmake -S voice-reply/android/app/src/main/cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llm_test -j4

      - name: Download the app's model (no login)
        run: |
          URL=$(grep -oE 'https://huggingface.co/[^"]+\.gguf' voice-reply/android/app/src/main/java/com/voicereply/app/ModelStore.kt)
          echo "URL: $URL"
          curl -fL --retry 3 -o model.gguf "$URL"
          ls -la model.gguf

      - name: German conversation
        run: |
          ./build/llm_test model.gguf voice-reply/android/app/src/main/assets/system_prompt.txt \
            "Hallo! Wie geht es dir heute?" \
            "Ich heiße Max und ich lerne Deutsch. Kannst du mir einen Tipp geben?" \
            "Was kann man am Wochenende in Berlin machen?" \
            "Wie heiße ich?" \
            "Ich habe gestern zu viel Kuchen gegessen und jetzt habe ich Bauchschmerzen." \
            "Erzähl mir bitte einen kurzen Witz."
