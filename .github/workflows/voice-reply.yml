name: VoiceReply build

on:
  push:
    paths:
      - "voice-reply/**"
      - ".github/workflows/voice-reply.yml"
  workflow_dispatch:

jobs:
  device-test:
    name: Offline AI test on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download model, load it and chat in German (on Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          working-directory: voice-reply/android
          script: |
            chmod +x gradlew
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -PwithX86 --no-daemon --stacktrace || (adb logcat -d | grep -E "OfflineAiDeviceTest|VoiceReplyLLM|AndroidRuntime|DownloadManager|ggml|llama|FATAL" | tail -200; exit 1)
            adb logcat -d -s OfflineAiDeviceTest:I VoiceReplyLLM:* | tail -40

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a release download
    defaults:
      run:
        working-directory: voice-reply/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceReply-apk
          path: voice-reply/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Direct download link (no login, no zip):
      # https://github.com/<owner>/<repo>/releases/download/voice-reply-latest/VoiceReply-DE.apk
      - name: Publish APK as "voice-reply-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoiceReply-DE.apk
          gh release delete voice-reply-latest --yes --cleanup-tag || true
          gh release create voice-reply-latest VoiceReply-DE.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "VoiceReply DE (latest build)" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install it on your phone (allow 'Install unknown apps')."
