name: VoiceReply build

on:
  push:
    paths:
      - "voice-reply/**"
      - ".github/workflows/voice-reply.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a release download
    defaults:
      run:
        working-directory: voice-reply/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceReply-apk
          path: voice-reply/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Direct download link (no login, no zip):
      # https://github.com/<owner>/<repo>/releases/download/voice-reply-latest/VoiceReply-DE.apk
      - name: Publish APK as "voice-reply-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoiceReply-DE.apk
          gh release delete voice-reply-latest --yes --cleanup-tag || true
          gh release create voice-reply-latest VoiceReply-DE.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "VoiceReply DE (latest build)" \
            --notes "Debug APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install it on your phone (allow 'Install unknown apps')."

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-reply/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
